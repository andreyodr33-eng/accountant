<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>PWA Tracker</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
  <link rel="manifest" href="manifest.json">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    /* Убираем всё лишнее */
html, body {
  margin: 0;
  padding: 0;
  height: 100%;
  overflow: hidden;
}

/* Карта на весь экран */
#map {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
}

/* Панель кнопок */
.controls {
  position: fixed;
  bottom: 0;
  left: 0;
  width: 100%;
 
  display: flex;
  gap: 10px;
  padding: 10px;
  box-sizing: border-box;
  background: rgba(0, 0, 0, 0.3);
  backdrop-filter: blur(10px);

  /* ВАЖНО для iPhone */
  padding-bottom: calc(10px + env(safe-area-inset-bottom));
}

/* Кнопки */
.controls button {
  flex: 1;
  padding: 15px;
  font-size: 16px;

  border: none;
  border-radius: 12px;

  background: #1E88E5;
  color: white;
}

.stats-overlay {
  position: fixed;
  top: 10px;
  left: 50%;
  transform: translateX(-50%);

  color: black;
  font-size: 16px;
  font-weight: bold;
  
  z-index: 1000;
}
 .history-panel {
  position: fixed;
  bottom: 0;
  left: 0;
  width: 100%;
  height: 60%;

  background: rgba(0,0,0,0.9);
  color: white;

  overflow-y: auto;
  padding: 15px;

  transform: translateY(100%);
  transition: 0.3s;

  z-index: 2000;
}

.history-panel.active {
  transform: translateY(0);
}

.history-item {
  border-bottom: 1px solid rgba(255,255,255,0.2);
  padding: 10px 0;
}   
  </style>
</head>
<body>

<p id="stats" class="stats-overlay">
  Дистанция: 0 км | Время: 0 сек
</p>
<div id="map"></div>  
<div id="historyPanel" class="history-panel">
  <h3>История маршрутов</h3>
  <div id="historyList"></div>
  <button onclick="closeHistory()">Закрыть</button>
</div>


<div class="controls">
<button onclick="startTracking()">Старт</button>
<button onclick="stopTracking()">Стоп</button>
<button onclick="openHistory()">История</button> 
 
</div>
<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<script>
let firstLocation = true;  
let map = L.map('map' , {
  zoomControl: false
}).setView([50.45, 30.52], 16); // Киев
let routeLine;
let displayedRoutes = [];  
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  maxZoom: 19,
}).addTo(map);
let currentMarker;
let watchId;
let route = [];
let totalDistance = 0;
let startTime = 0; 
let userRouteLine = null;
let activeRoute = null;  
function getDistance(lat1, lon1, lat2, lon2) {
  const R = 6371; // радиус Земли в км
  const dLat = (lat2 - lat1) * Math.PI / 180;
  const dLon = (lon2 - lon1) * Math.PI / 180;

  const a =
    Math.sin(dLat / 2) ** 2 +
    Math.cos(lat1 * Math.PI / 180) *
    Math.cos(lat2 * Math.PI / 180) *
    Math.sin(dLon / 2) ** 2;

  const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));

  return R * c;
}  


//Очистка старого маршрута
 function startTracking() {

  // очистка старого маршрута
  route = [];

  if (routeLine) {
    map.removeLayer(routeLine);
    routeLine = null;
  }

  if (userRouteLine) {
    map.removeLayer(userRouteLine);
    userRouteLine = null;
  }

  activeRoute = null;

  startTime = Date.now();
  totalDistance = 0;

  routeLine = L.polyline([], {
    color: 'blue',
    weight: 5
  }).addTo(map);

  firstLocation = true;
 

  startTime = Date.now();
  totalDistance = 0;
  routeLine = L.polyline([], {
    color: 'blue',
    weight: 5
  }).addTo(map);  
  
  firstLocation = true;
 
  watchId = navigator.geolocation.watchPosition((pos) => {

    const { latitude, longitude } = pos.coords;
    // Защита от битых координат
    if (
      typeof latitude !== "number" ||
      typeof longitude !== "number" ||
      isNaN(latitude) ||
      isNaN(longitude)
      ) }
        return;
  }
    
    const newPoint = [latitude, longitude];

    route.push(newPoint);
   if (routeLine) {
     routeLine.addLatLng(newPoint);
   }
    const elapsed = Math.floor((Date.now() - startTime) / 1000);

    document.getElementById("stats").innerText =
      `Дистанция: ${totalDistance.toFixed(2)} км | Время: ${formatTime(elapsed)}`;

    // считаем расстояние
    if (route.length > 1) {

      const last = route[route.length - 2];

      totalDistance += getDistance(
        last[0],
        last[1],
        latitude,
        longitude
      );
    }

    // 🔴 режим повторения маршрута
    if (activeRoute && userRouteLine) {

      const snapped = snapToRoute(newPoint, activeRoute);

      userRouteLine.addLatLng(snapped);
    }

    if (currentMarker) {
      map.removeLayer(currentMarker);
    }

    currentMarker = L.marker(newPoint).addTo(map);

    if (firstLocation) {
      map.setView(newPoint, 16);
      firstLocation = false;
    }

  },

  (err) => {
    alert("Ошибка геолокации: " + err.message);
  },

  {
    enableHighAccuracy: true
  });

}
                                                 

     function stopTracking() {

  navigator.geolocation.clearWatch(watchId);

  const elapsed = Math.floor((Date.now() - startTime) / 1000);
  const cleanRoute = route.filter(p =>
    Array.isArray(p) &&
    typeof p[0] === "number" &&
    typeof p[1] === "number"
  );  
  let routes = JSON.parse(localStorage.getItem('routes')) || [];

  routes.push({
    route: cleanRoute,
    distance: totalDistance,
    time: elapsed
  });

  if (routes.length > 5) {
    routes.shift();
  }

  localStorage.setItem('routes', JSON.stringify(routes));

  // удалить линию маршрута
  if (routeLine) {
    map.removeLayer(routeLine);
    routeLine = null;
  }

  // удалить красную линию
  if (userRouteLine) {
    map.removeLayer(userRouteLine);
    userRouteLine = null;
  }

  activeRoute = null;

  alert("Маршрут сохранён");
} 
function openHistory() {
  document.getElementById("historyPanel").classList.add("active");
  renderHistory();
}

function closeHistory() {

  document.getElementById("historyPanel")
    .classList.remove("active");

}
</script>
<script>
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('./service-worker.js');
}
</script>
 
  <script>
  function loadRoute() {
  const routes = JSON.parse(localStorage.getItem('routes')) || [];
  if (routeLine) {
    map.removeLayer(routeLine);
  }
  routes.forEach((r) => {
    const line = L.polyline(r.route, { color: 'blue' }).addTo(map);
    displayedRoutes.push(line);
    // 📍 подпись в конце маршрута
    const lastPoint = r.route[r.route.length - 1];

    const text = `📏 ${r.distance.toFixed(2)} км<br>⏱ ${r.time} сек`;

    L.marker(lastPoint)
      .addTo(map)
      .bindPopup(text);
  });
}
function renderHistory() {
  const routes = JSON.parse(localStorage.getItem('routes')) || [];
  const list = document.getElementById("historyList");

  list.innerHTML = "";

  routes.forEach((r, index) => {
    const div = document.createElement("div");
    div.className = "history-item";

    div.innerHTML = `
      <div>📏 ${r.distance.toFixed(2)} км</div>
      <div>⏱ ${formatTime(r.time)}</div>

      <button onclick="showRoute(${index})">
      Открыть
      </button>

      <button onclick="repeatRoute(${index})">
      Повторить
      </button>

      <button onclick="deleteRoute(${index})">
      Удалить
      </button>
    `;

    list.appendChild(div);
  });
}
function formatTime(sec) {
  const m = Math.floor(sec / 60);
  const s = sec % 60;
  return `${m} мин ${s} сек`;
}
function redrawRoutes() {

  displayedRoutes.forEach(line => {
    map.removeLayer(line);
  });

  displayedRoutes = [];

  const routes = JSON.parse(localStorage.getItem('routes')) || [];

  routes.forEach((r) => {
    const line = L.polyline(r.route, {
      color: 'blue'
    }).addTo(map);

    displayedRoutes.push(line);
  });
}    
function deleteRoute(index) {

  let routes = JSON.parse(localStorage.getItem('routes')) || [];

  routes.splice(index, 1);

  localStorage.setItem('routes', JSON.stringify(routes));

  // убрать текущий маршрут с карты
  if (routeLine) {
    map.removeLayer(routeLine);
    routeLine = null;
  }

  if (userRouteLine) {
    map.removeLayer(userRouteLine);
    userRouteLine = null;
  }

  renderHistory();
}

  function showRoute(index) {

  const routes = JSON.parse(localStorage.getItem('routes')) || [];

  const r = routes[index];

  // удалить старые линии
  if (routeLine) {
    map.removeLayer(routeLine);
  }

  if (userRouteLine) {
    map.removeLayer(userRouteLine);
  }

  // синяя линия маршрута
  routeLine = L.polyline(r.route, {
    color: 'blue',
    weight: 5
  }).addTo(map);

  // popup в конце маршрута
  const lastPoint = r.route[r.route.length - 1];

  L.marker(lastPoint)
    .addTo(map)
    .bindPopup(
      `📏 ${r.distance.toFixed(2)} км<br>⏱ ${formatTime(r.time)}`
    )
    .openPopup();

  map.fitBounds(routeLine.getBounds(), {
    padding: [20, 20]
  });

  closeHistory();
}

  function snapToRoute(point, route) {
     return point;
}

  function repeatRoute(index) {

  const routes = JSON.parse(localStorage.getItem('routes')) || [];

  const r = routes[index];

  activeRoute = r.route;

  // удалить старые линии
  if (routeLine) {
    map.removeLayer(routeLine);
  }

  if (userRouteLine) {
    map.removeLayer(userRouteLine);
  }

  // оригинальный маршрут
  routeLine = L.polyline(activeRoute, {
    color: 'blue',
    weight: 5
  }).addTo(map);

  // маршрут пользователя
  userRouteLine = L.polyline([], {
    color: 'red',
    weight: 5
  }).addTo(map);

  map.fitBounds(routeLine.getBounds(), {
    padding: [20, 20]
  });

  closeHistory();

  // запуск GPS
  startTracking();
} 
 window.addEventListener('load', () => {
   loadRoute();
   renderHistory();
 });  
</script>    
</body>
</html>
