<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>PWA Tracker</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
  <link rel="manifest" href="manifest.json">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    /* Убираем всё лишнее */
html, body {
  margin: 0;
  padding: 0;
  height: 100%;
  overflow: hidden;
}

/* Карта на весь экран */
#map {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
}

/* Панель кнопок */
.controls {
  position: fixed;
  bottom: 0;
  left: 0;
  width: 100%;

  display: flex;
  gap: 10px;
  padding: 10px;

  background: rgba(0, 0, 0, 0.3);
  backdrop-filter: blur(10px);

  /* ВАЖНО для iPhone */
  padding-bottom: calc(10px + env(safe-area-inset-bottom));
}

/* Кнопки */
.controls button {
  flex: 1;
  padding: 15px;
  font-size: 16px;

  border: none;
  border-radius: 12px;

  background: #1E88E5;
  color: white;
}

.stats-overlay {
  position: absolute;
  top: 10px;
  left: 50%;
  transform: translateX(-50%);

  background: rgba(0, 0, 0, 0.6);
  color: white;

  padding: 8px 12px;
  border-radius: 10px;

  font-size: 14px;
  z-index: 1000;
}
    
  </style>
</head>
<body>
<div id="map-container" style="position: relative;">  
<p id="stats">Дистанция: 0 км | Время: 0 cек</p>
</div>  
<div id="map"> style="height: 400px;"></div>
<div class="controls">
<button onclick="startTracking()">Старт</button>
<button onclick="stopTracking()">Стоп</button>
<button onclick="loadRoute()">Показать маршрут</button>
 
</div>
<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<script>
let map = L.map('map').setView([50.45, 30.52], 13); // Киев
let routeLine;
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  maxZoom: 19,
}).addTo(map);
let currentMarker;
let watchId;
let route = [];
let totalDistance = 0;
let startTime = 0; 
function getDistance(lat1, lon1, lat2, lon2) {
  const R = 6371; // радиус Земли в км
  const dLat = (lat2 - lat1) * Math.PI / 180;
  const dLon = (lon2 - lon1) * Math.PI / 180;

  const a =
    Math.sin(dLat / 2) ** 2 +
    Math.cos(lat1 * Math.PI / 180) *
    Math.cos(lat2 * Math.PI / 180) *
    Math.sin(dLon / 2) ** 2;

  const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));

  return R * c;
}  
function startTracking() {
startTime = Date.now();
totalDistance = 0;  
  route = [];
  if (routeLine) {
    map.removeLayer(routeLine);
  }
  routeLine = L.polyline([], { color: 'blue' }).addTo(map);
  watchId = navigator.geolocation.watchPosition((pos) => {
    const { latitude, longitude } = pos.coords;
    const newPoint = [latitude, longitude];
const elapsed = Math.floor((Date.now() - startTime) / 1000);

document.getElementById("stats").innerText =
  `Дистанция: ${totalDistance.toFixed(2)} км | Время: ${elapsed} сек`;
// считаем расстояние
if (route.length > 0) {
  const last = route[route.length - 1];

  totalDistance += getDistance(
    last[0],
    last[1],
    latitude,
    longitude
  );
}

route.push(newPoint);
    
    
    localStorage.setItem('route', JSON.stringify(route));
    
    routeLine.addLatLng(newPoint);
    if (currentMarker) {
      map.removeLayer(currentMarker);
  }
    currentMarker = L.marker(newPoint).addTo(map);
    map.setView(newPoint);
  },
   (err) => {
     alert("Ошибка геолокации: " + err.message);
 },
 {
     enableHighAccuracy: true
   }
 );
}
                                                 
  function stopTracking() {
  navigator.geolocation.clearWatch(watchId);

if (currentMarker) {
  map.removeLayer(currentMarker);
  currentMarker = null;
 }
}
function loadRoute() {
  const saved = JSON.parse(localStorage.getItem('route')) || [];

  // удалить старую линию, если есть
  if (routeLine) {
    map.removeLayer(routeLine);
  }

  // нарисовать новую
  routeLine = L.polyline(saved, { color: 'blue' }).addTo(map);
}
</script>
<script>
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('/accountant/servise-worker.js');
}
</script>
<script>
 function stopTracking() {
  navigator.geolocation.clearWatch(watchId);

  if (currentMarker) {
    map.removeLayer(currentMarker);
    currentMarker = null;
  }

  const elapsed = Math.floor((Date.now() - startTime) / 1000);

  alert(
    `Пройдено: ${totalDistance.toFixed(2)} км\nВремя: ${elapsed} сек`
  );
} 
</script>  
</body>
</html>
