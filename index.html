<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>PWA Tracker</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
  <link rel="manifest" href="manifest.json">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body>

<h2>Маршрут</h2>
<button onclick="startTracking()">Старт</button>
<button onclick="stopTracking()">Стоп</button>
<button onclick="loadRoute()">Показать маршрут</button>

<div id="map" style="height: 400px;"></div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<script>
let map = L.map('map').setView([50.45, 30.52], 13); // Киев
let routeLine;
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  maxZoom: 19,
}).addTo(map);

let watchId;
let route = [];

function startTracking() {
  route = [];
  if (routeLine) {
    map.removeLayer(routeLine);
  }
  routeLine = L.polyline([], { color: 'red' }).addTo(map);
  watchId = navigator.geolocation.watchPosition((pos) => {
    const { latitude, longitude } = pos.coords;
    const newPoint = [latitude, longitude];
    
    route.push(newPoint);
    localStorage.setItem('route', JSON.stringify(route));
    
    routeLine.addLatLng(newPoint);
    map.setView(newPoint);
  },
   (err) => {
     alert("Ошибка геолокации: " + err.message);
 },
 {
     enableHighAccuracy: true
   }
 );
}
                                                 
  function stopTracking() {
  navigator.geolocation.clearWatch(watchId);
}

function loadRoute() {
  const saved = JSON.parse(localStorage.getItem('route')) || [];

  // удалить старую линию, если есть
  if (routeLine) {
    map.removeLayer(routeLine);
  }

  // нарисовать новую
  routeLine = L.polyline(saved, { color: 'red' }).addTo(map);
}
</script>
<script>
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('/accountant/servise-worker.js');
}
</script>
</body>
</html>
